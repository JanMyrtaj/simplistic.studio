name: Supabase Ping

on:
  schedule:
    # Run every 6 hours (0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_API_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/make-server-548e39aa/projects"

      - name: Log Success
        run: echo "Supabase project pinged successfully at $(date -u)"

      - name: Notify on Failure
        if: failure()
        run: echo "Failed to ping Supabase project — check SUPABASE_URL and SUPABASE_API_KEY secrets"
